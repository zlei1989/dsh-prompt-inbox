# dsh-prompt-inbox 组合包（bundle）补丁层。
#
# 一行同时服务于包的两半：
#   - Loader 把包 main（lib/index.js，由 src/host/index.ts 构建）当作普通 host
#     插件行导入（inject 声明的 tools / systemPrompt / webServer 服务）；
#   - web client 模块系统（dsh-client-modules）看到同一行，解析包的
#     `dsh.client` 声明，并把 exports["./client"]（lib/client.js，由
#     src/client/index.ts 构建）服务到 /plugins/<id>/client.js。
#
# 行名必须与包名完全一致：这是 Loader 解析包、以及 client-modules 扫描器
# 回查 package.json 时使用的键。
- insert:
    - id: prompt-inbox
      name: dsh-prompt-inbox
